[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "arona"
version = "0.1.0"
description = "Accelerator-aware rewriting and operator-compatible neural adaptation for ONNX models"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "ARONA contributors" },
]
dependencies = [
  "numpy>=2.1",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "prompt-toolkit>=3.0.52",
  "pydantic>=2.10",
  "pyserial>=3.5",
  "typer>=0.15",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
arona = "arona.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/arona"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "hardware: tests that require a physically connected STM32 board",
]

[tool.coverage.run]
branch = true
source = ["arona"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["arona"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
